<title id="title">Carga comutada com IRFZ44N</title><desc id="desc">Ramo fixo de 100 ohms e ramo de 22 ohms, MOSFET e shunt de 1 ohm. Resistor de 100 kilohms entre G e S. Todos os terras em 0 V.</desc>
